name: YourPods
options:
  bundleIdPrefix: com.asecretcompany
  developmentLanguage: en
  deploymentTarget:
    iOS: "18.0"
    macOS: "14.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

# ─── YourPods Sync ──────────────────────────────────────────────────────────
# The Firebase SDK is used EXCLUSIVELY for YourPods Sync account
# authentication. It is NOT required to build or run the app —
# Vault Mode (local-only) and gPodder sync work without it.
#
# For up-to-date information on the app source and YourPods Sync
# spec/source, visit: https://opensource.yourpods.app
# ───────────────────────────────────────────────────────────────────────────
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    minorVersion: "11.0.0"
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios.git
    # 5.0.0 fails to compile on Xcode 27 / Swift 6.4 (PaywallColor: "Invalid
    # redeclaration of synthesized memberwise init"). Float to the latest 5.x
    # (same major = no breaking API changes) which supports the newer toolchain.
    majorVersion: "5.80.0"

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: YOUR_TEAM_ID
    CODE_SIGN_STYLE: Automatic
    # Calendar versioning from 26.8.0 onward: yy.mm.vv — year, month, and the
    # release's index within that month. Supersedes the 2.0.x semver line;
    # 26.8.0 is what 2.0.5 became. CFBundleVersion keeps climbing monotonically
    # across the change because App Store Connect requires it.
    MARKETING_VERSION: "26.8.0"
    CURRENT_PROJECT_VERSION: "80"
    ENABLE_USER_SCRIPT_SANDBOXING: false
    SWIFT_STRICT_CONCURRENCY: targeted
    # Opt into the Swift 6 key-path-literal Sendable inference (SE-0418) while
    # still in the 5.10 language mode. Without it, `\Model.prop` key paths in
    # #Predicate / SortDescriptor emit "KeyPath<Model,_> does not conform to
    # Sendable" warnings (forecast Swift 6 errors) across SwiftData fetches.
    OTHER_SWIFT_FLAGS:
      - "$(inherited)"
      - "-enable-upcoming-feature"
      - "InferSendableFromCaptures"
    # ─── Localization ────────────────────────────────────────────────────
    # All four default to NO. With any of them off, every .xcstrings stays
    # empty and the app ships English in every locale — silently, with a
    # green build. Guarded by LocalizationBuildSettingsGuardTests.
    SWIFT_EMIT_LOC_STRINGS: true               # emit .stringsdata from Swift
    LOCALIZATION_PREFERS_STRING_CATALOGS: true # .xcstrings, not .strings
    LOCALIZED_STRING_CODE_COMMENTS: true       # carry `comment:` into catalogs
    STRING_CATALOG_GENERATE_SYMBOLS: true      # generated symbol accessors

targets:
  YourPods:
    type: application
    platform: iOS
    sources:
      - path: YourPods/YourPods
        type: group
      - path: YourPodsComplication/ComplicationDataStore.swift
        type: file
      - path: YourPodsWidgets/WidgetPlaybackIntents.swift
        type: file
      - path: YourPodsWidgets/WidgetArtworkLoader.swift
        type: file
      - path: YourPodsWidgets/WidgetPlaybackBridge.swift
        type: file
      - path: YourPods/GoogleService-Info.plist
        type: file
        buildPhase: resources
      - path: YourPods/PrivacyInfo.xcprivacy
        type: file
        buildPhase: resources

    preBuildScripts:
      - name: "Sync Version to Info.plist"
        basedOnDependencyAnalysis: false
        script: |
          for plist in "YourPods/Info.plist" "YourPods/Info-macOS.plist" "YourPodsWidgets/Info.plist" "YourPodsWatch/Info.plist" "YourPodsComplication/Info.plist"; do
            if [ -f "${SRCROOT}/$plist" ]; then
              /usr/libexec/PlistBuddy -c "Set :CFBundleVersion \$(CURRENT_PROJECT_VERSION)" "${SRCROOT}/$plist"
              /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString \$(MARKETING_VERSION)" "${SRCROOT}/$plist"
            fi
          done
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.asecretcompany.yourpods
        INFOPLIST_FILE: YourPods/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
        ENABLE_PREVIEWS: true
        SKIP_INSTALL: false
        INSTALL_PATH: "$(LOCAL_APPS_DIR)"
        SWIFT_OBJC_BRIDGING_HEADER: YourPods/YourPods/Utilities/BridgingHeader.h
    entitlements:
      path: YourPods/YourPods.entitlements
      properties:
        com.apple.developer.carplay-audio: true
        com.apple.developer.siri: true
        com.apple.security.application-groups:
          - group.com.asecretcompany.yourpods
    info:
      path: YourPods/Info.plist
      properties:
        CFBundleDisplayName: YourPods
        CFBundleName: YourPods
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
          - fetch
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.asecretcompany.yourpods.refresh
        NSAppTransportSecurity:
          # Required: user-entered podcast feed URLs and self-hosted gPodder
          # servers may use HTTP. The app defaults to HTTPS and warns users
          # about HTTP but does not block it. Exception domains are not
          # feasible since the domains are user-defined.
          # YourPods never downgrades an HTTPS URL — see
          # URLSanitizer.suggestedHTTPSURL, which upgrades where it can.
          NSAllowsArbitraryLoads: true
          # Self-hosted Nextcloud/gPodder is routinely on a LAN address.
          NSAllowsLocalNetworking: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
        NSSupportsLiveActivities: true
        NSSiriUsageDescription: "Play podcasts using Siri."
        IntentsSupported:
          - INPlayMediaIntent
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - yourpods
        ITSAppUsesNonExemptEncryption: false
        LSApplicationQueriesSchemes:
          - obsidian
        FIREBASE_ANALYTICS_COLLECTION_DEACTIVATED: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseAppCheck
      - package: RevenueCat
        product: RevenueCat
      - target: YourPodsWidgets
        embed: true
        codeSign: true
        copy:
          destination: plugins
      - target: YourPodsWatch
        embed: true
        codeSign: true

  YourPodsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: YourPodsTests
        type: group
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.asecretcompany.yourpods.tests
        GENERATE_INFOPLIST_FILE: true
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/YourPods.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/YourPods"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: YourPods

  YourPodsWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: YourPodsWidgets
        type: group
      - path: YourPodsComplication/ComplicationDataStore.swift
        type: file
      # DurationFormatting.swift is shared UI formatting; the widget target
      # does not glob YourPods/YourPods, so the type must be listed explicitly.
      - path: YourPods/YourPods/Utils/DurationFormatting.swift
        type: file
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.asecretcompany.yourpods.YourPodsLiveActivity
        INFOPLIST_FILE: YourPodsWidgets/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: WIDGET_EXTENSION
        SKIP_INSTALL: true
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../../Frameworks"
    info:
      path: YourPodsWidgets/Info.plist
      properties:
        CFBundleDisplayName: YourPods Live Activity
        CFBundleName: YourPodsWidgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: YourPodsWidgets/YourPodsWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.asecretcompany.yourpods

  YourPodsMac:
    type: application
    platform: macOS
    sources:
      - path: YourPods/YourPods
        type: group
        excludes:
          - "Services/CarPlayService.swift"
      - path: YourPods/GoogleService-Info.plist
        type: file
        buildPhase: resources
      - path: YourPods/PrivacyInfo.xcprivacy
        type: file
        buildPhase: resources
    preBuildScripts:
      - name: "Sync Version to Info.plist"
        basedOnDependencyAnalysis: false
        script: |
          for plist in "YourPods/Info.plist" "YourPods/Info-macOS.plist" "YourPodsWidgets/Info.plist" "YourPodsWatch/Info.plist" "YourPodsComplication/Info.plist"; do
            if [ -f "${SRCROOT}/$plist" ]; then
              /usr/libexec/PlistBuddy -c "Set :CFBundleVersion \$(CURRENT_PROJECT_VERSION)" "${SRCROOT}/$plist"
              /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString \$(MARKETING_VERSION)" "${SRCROOT}/$plist"
            fi
          done
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.asecretcompany.yourpods
        PRODUCT_NAME: YourPods
        INFOPLIST_FILE: YourPods/Info-macOS.plist
        ENABLE_PREVIEWS: true
        SKIP_INSTALL: false
        INSTALL_PATH: "$(LOCAL_APPS_DIR)"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ARCHS: arm64
        SWIFT_OBJC_BRIDGING_HEADER: YourPods/YourPods/Utilities/BridgingHeader.h
    entitlements:
      path: YourPods/YourPodsMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.application-groups:
          - group.com.asecretcompany.yourpods
    info:
      path: YourPods/Info-macOS.plist
      properties:
        CFBundleDisplayName: YourPods
        CFBundleName: YourPods
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - yourpods
        NSAppTransportSecurity:
          # Same reasoning as the iOS target above: user-defined feed and
          # self-hosted server URLs, some of them plain HTTP on a LAN.
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSSiriUsageDescription: "Play podcasts using Siri."
        ITSAppUsesNonExemptEncryption: false
        FIREBASE_ANALYTICS_COLLECTION_DEACTIVATED: true
        LSApplicationCategoryType: public.app-category.music
        NSPrincipalClass: $(PRODUCT_MODULE_NAME).YourPodsApplication
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseAppCheck
      - package: RevenueCat
        product: RevenueCat

  YourPodsWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: YourPodsWatch
        type: group
      - path: YourPods/YourPods/Services/WatchWireFormat.swift
        type: file
      - path: YourPods/YourPods/Services/WatchAdvancePlanner.swift
        type: file
      - path: YourPods/YourPods/Services/WatchQueueMerger.swift
        type: file
      - path: YourPods/YourPods/Services/WatchArtworkDownsampler.swift
        type: file
      - path: YourPods/YourPods/Services/WatchDownloadHygiene.swift
        type: file
      - path: YourPods/YourPods/Services/WatchSpeedPolicy.swift
        type: file
      - path: YourPods/YourPods/Services/WatchSleepTimerModel.swift
        type: file
      - path: YourPods/YourPods/Services/WatchSkipIntervals.swift
        type: file
      # WatchWireFormat.swift adopts WireString; the watch target does not
      # glob YourPods/YourPods, so the type must be listed explicitly.
      - path: YourPods/YourPods/Utils/WireString.swift
        type: file
      # DurationFormatting.swift is shared UI formatting; same reason.
      - path: YourPods/YourPods/Utils/DurationFormatting.swift
        type: file
      # EpisodeAccessibility owns the spoken-label fragments and the shared
      # VoiceOver list separator, which the watch's row labels also use.
      - path: YourPods/YourPods/Utils/EpisodeAccessibility.swift
        type: file
      - path: YourPodsComplication/ComplicationDataStore.swift
        type: file
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.asecretcompany.yourpods.watchkitapp
        INFOPLIST_FILE: YourPodsWatch/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.10"
        SKIP_INSTALL: true
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        TARGETED_DEVICE_FAMILY: 4
    entitlements:
      path: YourPodsWatch/YourPodsWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.asecretcompany.yourpods.watch
    info:
      path: YourPodsWatch/Info.plist
      properties:
        CFBundleDisplayName: YourPods
        CFBundleName: YourPodsWatch
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIBackgroundModes:
          - audio
        WKCompanionAppBundleIdentifier: com.asecretcompany.yourpods
        WKApplication: true
    dependencies:
      - target: YourPodsComplication
        embed: true
        codeSign: true
        copy:
          destination: plugins

  YourPodsComplication:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: YourPodsComplication
        type: group
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.asecretcompany.yourpods.watchkitapp.widgets
        INFOPLIST_FILE: YourPodsComplication/Info.plist
        SWIFT_VERSION: "5.10"
        SKIP_INSTALL: true
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        TARGETED_DEVICE_FAMILY: 4
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../../Frameworks"
    entitlements:
      path: YourPodsComplication/YourPodsComplication.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.asecretcompany.yourpods.watch
    info:
      path: YourPodsComplication/Info.plist
      properties:
        CFBundleDisplayName: YourPods Complication
        CFBundleName: YourPodsComplication
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

schemes:
  YourPods:
    build:
      targets:
        YourPods: all
        YourPodsTests: [test]
        YourPodsWidgets: all
        YourPodsWatch: all
        YourPodsComplication: all
    run:
      config: Debug
      executable: YourPods
    test:
      config: Debug
      # Test tiers live in TestPlans/*.xctestplan (coverage + parallelization
      # are owned by the plans, not the scheme):
      #   Full  — every test; the default plan and the merge gate.
      #   Smoke — Full minus the real-time-sleep classes, for the inner loop.
      # Coverage is OFF by default for speed; re-enable it when needed with
      # `-enableCodeCoverage YES`, which overrides the plan setting.
      # Run a tier explicitly with: xcodebuild test ... -testPlan Smoke
      testPlans:
        - path: TestPlans/Full.xctestplan
          defaultPlan: true
        - path: TestPlans/Smoke.xctestplan
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  YourPodsWidgets:
    build:
      targets:
        YourPodsWidgets: all
    run:
      config: Debug
      askForAppToLaunch: true

  YourPodsWatch:
    build:
      targets:
        YourPodsWatch: all
        YourPodsComplication: all
    run:
      config: Debug
      executable: YourPodsWatch

  YourPodsMac:
    build:
      targets:
        YourPodsMac: all
    run:
      config: Debug
      executable: YourPodsMac
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
